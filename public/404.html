<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#000000"/>
    <meta
            name="description"
            content="Woocommerce test reports"
    />
    <title>Not found - Woocommerce test reports</title>
    <style>
        body {
            background-color: #343a40;
            margin: 0;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: #ccc;
        }

        .container {
            margin: 50px auto 40px auto;
            width: 600px;
            text-align: center;
        }

        a {
            color: #4183c4;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        h1 {
            width: 800px;
            position: relative;
            left: -100px;
            letter-spacing: -1px;
            line-height: 60px;
            font-size: 60px;
            font-weight: 100;
            margin: 0 0 50px 0;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        #suggestions {
            margin-top: 35px;
            color: #ccc;
        }

        #suggestions a {
            font-size: 14px;
            margin: 0 10px;
        }

    </style>
</head>
<body>
<div class="container">
    <script>
        const match = window.location.href.match(/woocommerce-test-reports\/(.+)/i);
        if(match[1]) {
            window.location.href = `https://a8c-woo-test-reports.s3.amazonaws.com/reports/${match[1]}/index.html`;
        }
    </script>

    <h1>404</h1>
    <p>Page not found.</p>

    <ul>
        <li>Make sure the url is correct</li>
        <li>See <a href="https://woocommerce.github.io/woocommerce-test-reports/">the reports dashboard</a></li>
    </ul>

    <div id="suggestions">
        <a href="https://woocommerce.github.io/woocommerce-test-reports/">Dashboard</a>
        <a href="https://github.com/woocommerce/woocommerce-test-reports">Code</a>
        <a href="https://github.com/woocommerce/woocommerce-test-reports/actions">Actions</a>
    </div>

</div>
</body>
</html>
